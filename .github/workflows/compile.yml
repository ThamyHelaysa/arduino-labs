name: Compile

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [painel]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Use example secrets
        run: cp projects/${{ matrix.project }}/segredos.exemplo.h projects/${{ matrix.project }}/segredos.h
      - name: Compile
        run: arduino-cli compile --profile esp32 projects/${{ matrix.project }}
